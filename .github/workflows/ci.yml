name: CI

on:
  push:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test locked Linux dependencies
        run: docker build --target test -t preciso-graphrag:test .
      - name: Build runtime wheel image
        run: docker build --target runtime -t preciso-graphrag:ci .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP smoke client
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Verify MCP and persistent volume
        run: >-
          python -m scripts.smoke_mcp -- docker run --rm -i
          --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m
          --cap-drop ALL --security-opt no-new-privileges
          --mount type=volume,source=preciso-ci-smoke,target=/data
          -e GRAPHRAG_EMBEDDING_PROVIDER=fallback preciso-graphrag:ci
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements.txt -r requirements-dev.txt

      - name: Compile check (required by CONTRIBUTING.md)
        run: python -m compileall core ingest preciso_mcp

      # Everything below runs fully offline: lazy embedding init, 8-dim
      # fallback embedder, deterministic LLM/tokenizer stubs. No Ollama,
      # no services, no secrets.
      - name: Pytest suite (offline)
        run: python -m pytest -q

      - name: Guard script — two-zone summary merge
        run: python test/summary_merge_manual.py

      - name: Guard script — SUMMARY_MARKER leak invariant
        run: python test/marker_leak_manual.py
