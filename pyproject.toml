[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preciso-graphrag"
version = "0.1.0"
description = "Local-first GraphRAG system exposed as an MCP server"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
preciso-backup = "preciso_mcp.backup_cli:main"

[project.optional-dependencies]
cloud-embeddings = ["openai>=1.0.0", "cohere>=4.0.0"]
exports = ["neo4j>=5.0.0", "qdrant-client>=1.9.0"]
all = [
    "openai>=1.0.0",
    "cohere>=4.0.0",
    "neo4j>=5.0.0",
    "qdrant-client>=1.9.0",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
py-modules = ["config"]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
# Only the importable code: the local MCP package is preciso_mcp so it can
# never shadow the MCP SDK's `mcp` package again.
include = ["core*", "ingest*", "preciso_mcp*"]

[tool.ruff.lint]
# Keep the established correctness checks stable across lint-tool upgrades.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These entry-point files deliberately adjust sys.path before importing the
# project so they also work from a source checkout without an editable install.
"tests/manual/*_manual.py" = ["E402"]
"tests/conftest.py" = ["E402"]
